name: Checks

on:
  push:
  pull_request:

jobs:
  research:
    name: Research toolkit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest tests/ -q
      - name: End-to-end pipeline on synthetic tournaments
        run: python examples/demo_end_to_end.py

  website:
    name: Website links and assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scripts/check_site.py
